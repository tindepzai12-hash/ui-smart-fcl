services:
  - type: web
    name: ui-smart-fcl
    runtime: node
    region: singapore
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: UI_SMART_PASSWORD
        sync: false
      - key: UI_SMART_SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
